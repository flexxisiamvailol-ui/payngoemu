<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmuArchive by Payngobd</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-analytics.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        lavender: { 50: '#f3e8ff', 100: '#e9d5ff' },
                        navy: { 800: '#1e1b4b', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
<body class="bg-gradient-to-br from-gray-50 via-lavender-50 to-white dark:from-navy-900 dark:via-navy-800 dark:to-gray-900 min-h-screen text-gray-800 dark:text-gray-200 p-4 md:p-8 flex items-center justify-center transition-colors duration-500">
    
    <div id="snake"></div>
    <canvas id="particles-canvas"></canvas>

    <div class="max-w-7xl w-full glass-panel relative z-10 rounded-[2.5rem] shadow-[0_20px_60px_-15px_rgba(167,139,250,0.3)] dark:shadow-[0_20px_60px_-15px_rgba(0,0,0,0.7)] overflow-hidden flex flex-col h-[90vh]">
        <header class="py-6 px-8 border-b border-purple-200/50 dark:border-gray-700/50 bg-white/40 dark:bg-navy-900/40 flex items-center justify-between relative z-10 shadow-sm dark:shadow-none">
            <div class="w-14"></div>
            <div class="flex items-center gap-4">
                <div class="logo-icon relative flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 shadow-lg shadow-purple-500/40 dark:shadow-purple-900/50">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4h2a8 8 0 018 8v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4a8 8 0 018-8z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 14h.01M9 14h.01M12 11h.01"></path>
                    </svg>
                </div>
                <h1 class="shimmer-text text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-purple-700 via-indigo-500 to-purple-700 dark:from-purple-400 dark:via-indigo-300 dark:to-purple-400">EmuArchive by Payngobd</h1>
            </div>
            <button id="theme-toggle" onclick="toggleTheme()" class="relative w-14 h-14 rounded-2xl bg-white/60 dark:bg-gray-800/60 border border-purple-200/60 dark:border-purple-500/30 shadow-lg hover:shadow-xl hover:scale-105 active:scale-95 transition-all duration-300 flex items-center justify-center group backdrop-blur-sm" aria-label="Toggle theme">
                <svg id="icon-sun" class="w-6 h-6 text-amber-500 transition-all duration-500 absolute opacity-0 rotate-90 scale-0 dark:opacity-100 dark:rotate-0 dark:scale-100" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg id="icon-moon" class="w-6 h-6 text-purple-600 transition-all duration-500 absolute opacity-100 rotate-0 scale-100 dark:opacity-0 dark:-rotate-90 dark:scale-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <div class="absolute inset-0 rounded-2xl bg-gradient-to-tr from-amber-400/0 to-orange-400/0 dark:from-amber-400/10 dark:to-orange-400/10 group-hover:from-purple-400/10 group-hover:to-indigo-400/10 dark:group-hover:from-amber-400/20 dark:group-hover:to-orange-400/20 transition-all duration-300"></div>
            </button>
        </header>
        <div class="flex flex-col md:flex-row flex-1 overflow-hidden">
            <nav class="md:w-1/3 lg:w-1/4 p-6 bg-white/20 dark:bg-navy-900/20 border-r border-purple-200/50 dark:border-gray-700/50 flex flex-col gap-3 z-10">
                <div class="search-container mb-4">
                    <input id="search-input" type="text" placeholder="ค้นหารุ่น..." class="search-input w-full px-4 py-2.5 rounded-xl font-semibold border dark:border-gray-700 outline-none">
                </div>
                <p class="text-xs font-bold text-gray-400 dark:text-gray-500 mb-2 uppercase tracking-widest pl-2">Select Version</p>
                <button onclick="switchTab('bs5')" id="tab-bs5" class="nav-btn ripple-container w-full text-left px-5 py-4 rounded-2xl font-bold flex items-center gap-3 shadow-md bg-gradient-to-r from-lavender-100 to-white dark:from-gray-800 dark:to-navy-800 text-purple-800 dark:text-purple-300 border border-purple-300 dark:border-purple-500/50 relative overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-r from-purple-500/10 to-transparent dark:from-purple-500/20"></div>
                    <span class="relative z-10 flex items-center justify-center w-9 h-9 rounded-full bg-purple-600 dark:bg-purple-500 text-white text-sm shadow-sm">5</span>
                    <span class="relative z-10">App Player 5</span>
                </button>
                <button onclick="switchTab('bs4')" id="tab-bs4" class="nav-btn ripple-container w-full text-left px-5 py-4 rounded-2xl font-bold flex items-center gap-3 text-gray-500 dark:text-gray-400 hover:bg-white/60 dark:hover:bg-gray-800/60 hover:text-purple-700 dark:hover:text-purple-300 border border-transparent hover:border-purple-200 dark:hover:border-gray-700 group relative overflow-hidden">
                    <span class="relative z-10 flex items-center justify-center w-9 h-9 rounded-full bg-gray-200 dark:bg-gray-800 text-gray-500 dark:text-gray-400 text-sm">4</span>
                    <span class="relative z-10">App Player 4</span>
                </button>
                
                    <a href="https://github.com/phwyverysad/BlueStacks" target="_blank" class="github-btn w-full px-5 py-3.5 rounded-2xl font-bold flex items-center justify-center gap-3 text-white bg-gradient-to-r from-gray-800 to-gray-900 hover:from-black hover:to-gray-800 dark:from-purple-600 dark:to-indigo-600 dark:hover:from-purple-500 dark:hover:to-indigo-500 shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300 group">
                        <svg class="w-6 h-6 group-hover:scale-110 transition-transform duration-300" fill="currentColor" viewBox="0 0 24 24">
                            <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path>
                        </svg>
                        <span>GitHub</span>
                    </a>
                    <button onclick="showLoginModal()" class="w-full mt-3 px-5 py-2.5 rounded-xl font-bold text-xs text-gray-400 hover:text-purple-500 transition-colors flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 00-2 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        Admin Login
                    </button>
                </div>
            </nav>
            <main id="main-content" class="md:w-2/3 lg:w-3/4 p-6 md:p-8 overflow-y-auto z-10 bg-transparent relative">
                <div id="content-bs5" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5 fade-in"></div>
                <div id="content-bs4" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5 hidden fade-in"></div>
                <div id="dynamic-content-container"></div>
            </main>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="login-modal" class="fixed inset-0 z-[100] flex items-center justify-center hidden bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-navy-900 w-full max-w-md rounded-[2rem] p-8 shadow-2xl border border-purple-200/50 dark:border-purple-500/20">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-800 dark:text-white">Admin Login</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-500 mb-1">Email</label>
                    <input id="login-email" type="email" class="w-full px-4 py-3 rounded-xl border dark:bg-gray-800 dark:border-gray-700 outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-500 mb-1">Password</label>
                    <input id="login-password" type="password" class="w-full px-4 py-3 rounded-xl border dark:bg-gray-800 dark:border-gray-700 outline-none focus:border-purple-500">
                </div>
                <button onclick="handleLogin()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-purple-500/30">Sign In</button>
                <button onclick="hideLoginModal()" class="w-full text-gray-400 text-sm font-semibold hover:text-gray-600">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard Overlay -->
    <div id="admin-dashboard" class="fixed inset-0 z-[90] flex flex-col hidden bg-gray-50 dark:bg-navy-900 overflow-hidden">
        <header class="py-4 px-8 border-b dark:border-gray-700 bg-white dark:bg-navy-800 flex items-center justify-between shadow-sm">
            <h2 class="text-xl font-bold text-purple-600">EmuArchive Admin</h2>
            <div class="flex items-center gap-4">
                <button onclick="logout()" class="px-4 py-2 rounded-lg bg-red-500/10 text-red-500 font-bold hover:bg-red-500 hover:text-white transition-all">Logout</button>
                <button onclick="hideAdminDashboard()" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-200 dark:bg-gray-700 text-gray-500 dark:text-white hover:bg-purple-500 hover:text-white transition-all">✕</button>
            </div>
        </header>
        <div class="flex-1 overflow-y-auto p-8">
            <div class="max-w-6xl mx-auto space-y-8">
                <!-- Manage Categories -->
                <section>
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-bold">Versions / Categories</h3>
                        <button onclick="showAddCategoryForm()" class="bg-purple-600 text-white px-4 py-2 rounded-lg font-bold text-sm shadow-md hover:bg-purple-700">Add New Version</button>
                    </div>
                    <div id="admin-categories-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
                </section>

                <hr class="dark:border-gray-700">

                <!-- Manage Items -->
                <section>
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-bold">Download Links</h3>
                        <button onclick="showAddItemForm()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold text-sm shadow-md hover:bg-indigo-700">Add New Download</button>
                    </div>
                    <div class="mb-4">
                        <select id="admin-category-filter" onchange="loadAdminItems()" class="px-4 py-2 rounded-lg border dark:bg-gray-800 dark:border-gray-700 outline-none">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                    <div id="admin-items-list" class="grid grid-cols-1 gap-4"></div>
                </section>
            </div>
        </div>
    </div>

    <!-- Add/Edit Category Modal -->
    <div id="category-modal" class="fixed inset-0 z-[110] flex items-center justify-center hidden bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-navy-900 w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <h3 id="category-modal-title" class="text-xl font-bold mb-4">Add Version</h3>
            <div class="space-y-4">
                <input id="cat-name" type="text" placeholder="Version Name (e.g. App Player 5)" class="w-full px-4 py-2 rounded-lg border dark:bg-gray-800 dark:border-gray-700 outline-none">
                <input id="cat-number" type="text" placeholder="Display Number (e.g. 5)" class="w-full px-4 py-2 rounded-lg border dark:bg-gray-800 dark:border-gray-700 outline-none">
                <div class="flex gap-2">
                    <button onclick="saveCategory()" class="flex-1 bg-purple-600 text-white font-bold py-2 rounded-lg">Save</button>
                    <button onclick="hideCategoryModal()" class="flex-1 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-white font-bold py-2 rounded-lg">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Item Modal -->
    <div id="item-modal" class="fixed inset-0 z-[110] flex items-center justify-center hidden bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-navy-900 w-full max-w-lg rounded-2xl p-6 shadow-2xl overflow-y-auto max-h-[90vh]">
            <h3 id="item-modal-title" class="text-xl font-bold mb-4">Add Download</h3>
            <div class="space-y-4">
                <select id="item-category" class="w-full px-4 py-2 rounded-lg border dark:bg-gray-800 dark:border-gray-700 outline-none"></select>
                <input id="item-version" type="text" placeholder="Version Number (e.g. 5.21.660)" class="w-full px-4 py-2 rounded-lg border dark:bg-gray-800 dark:border-gray-700 outline-none">
                <input id="item-url" type="text" placeholder="Download URL" class="w-full px-4 py-2 rounded-lg border dark:bg-gray-800 dark:border-gray-700 outline-none">
                
                <div class="flex flex-wrap gap-4 p-4 border dark:border-gray-700 rounded-lg">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="tag-latest" class="accent-purple-600"> <span class="text-sm font-semibold">Latest</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="tag-most" class="accent-orange-500"> <span class="text-sm font-semibold">Most Downloaded</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="tag-suggested" class="accent-blue-500"> <span class="text-sm font-semibold">Suggested</span>
                    </label>
                </div>

                <div class="flex gap-2">
                    <button onclick="saveItem()" class="flex-1 bg-indigo-600 text-white font-bold py-2 rounded-lg">Save</button>
                    <button onclick="hideItemModal()" class="flex-1 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-white font-bold py-2 rounded-lg">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
    <script src="admin.js"></script>
</body>
</html>
